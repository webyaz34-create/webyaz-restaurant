<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paket Takip — Webyaz Restaurant</title>
  <link rel="stylesheet" href="/css/common.css">
  <style>
    body { background: var(--bg-primary); }
    .delivery-page { min-height: 100vh; padding: 0; }

    .delivery-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 24px; background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-primary);
    }
    .delivery-header-left { display: flex; align-items: center; gap: 16px; }
    .delivery-title { font-size: 1.2rem; font-weight: 800; }
    .delivery-title span { color: var(--primary); }

    .delivery-stats {
      display: flex; gap: 12px;
    }
    .delivery-stat {
      display: flex; align-items: center; gap: 8px; padding: 8px 16px;
      background: var(--bg-tertiary); border-radius: var(--radius-md);
      border: 1px solid var(--border-primary); font-size: 0.8rem;
    }
    .delivery-stat-value { font-weight: 800; font-size: 1.1rem; }

    .delivery-board {
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: 16px; padding: 20px; height: calc(100vh - 70px); overflow: hidden;
    }
    .delivery-column {
      background: var(--bg-secondary); border: 1px solid var(--border-primary);
      border-radius: var(--radius-lg); display: flex; flex-direction: column;
      overflow: hidden;
    }
    .delivery-column-header {
      padding: 14px 16px; font-weight: 700; font-size: 0.85rem;
      border-bottom: 1px solid var(--border-primary);
      display: flex; align-items: center; justify-content: space-between;
    }
    .delivery-column-header .count {
      background: var(--bg-hover); padding: 2px 10px; border-radius: 12px;
      font-size: 0.75rem; font-weight: 800;
    }
    .col-preparing .delivery-column-header { border-top: 3px solid #3b82f6; }
    .col-ready .delivery-column-header { border-top: 3px solid #22c55e; }
    .col-out .delivery-column-header { border-top: 3px solid #f97316; }
    .col-delivered .delivery-column-header { border-top: 3px solid #8b949e; }

    .delivery-column-body {
      flex: 1; overflow-y: auto; padding: 12px; display: flex;
      flex-direction: column; gap: 10px;
    }

    .delivery-card {
      background: var(--bg-tertiary); border: 1px solid var(--border-primary);
      border-radius: var(--radius-md); padding: 14px;
      transition: all var(--transition-fast); cursor: default;
    }
    .delivery-card:hover { border-color: var(--primary); box-shadow: 0 0 12px var(--primary-glow); }
    .delivery-card-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 8px;
    }
    .delivery-card-id { font-weight: 800; font-size: 0.9rem; }
    .delivery-card-type {
      font-size: 0.65rem; font-weight: 700; padding: 2px 8px;
      border-radius: 6px; text-transform: uppercase;
    }
    .type-delivery { background: rgba(249,115,22,0.15); color: #f97316; }
    .type-takeaway { background: rgba(34,197,94,0.15); color: #22c55e; }

    .delivery-card-customer {
      font-size: 0.78rem; color: var(--text-secondary); margin-bottom: 6px;
    }
    .delivery-card-items {
      font-size: 0.72rem; color: var(--text-tertiary);
      border-top: 1px solid var(--border-primary);
      padding-top: 6px; margin-top: 6px;
      max-height: 60px; overflow: hidden;
    }
    .delivery-card-footer {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: 10px; font-size: 0.72rem;
    }
    .delivery-card-amount { font-weight: 800; color: var(--primary); font-size: 0.9rem; }
    .delivery-card-time { color: var(--text-tertiary); }

    .delivery-card-actions { display: flex; gap: 6px; margin-top: 10px; }
    .delivery-card-actions .btn { font-size: 0.7rem; padding: 5px 10px; }

    .delivery-empty {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100%; color: var(--text-tertiary); font-size: 0.8rem; text-align: center;
    }
    .delivery-empty-icon { font-size: 2rem; margin-bottom: 8px; opacity: 0.4; }

    @media (max-width: 1024px) { .delivery-board { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 600px) { .delivery-board { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="delivery-page">
    <header class="delivery-header">
      <div class="delivery-header-left">
        <a href="/" style="text-decoration:none;color:var(--text-primary);display:flex;align-items:center;gap:6px;font-size:0.85rem;padding:8px 14px;border-radius:8px;background:var(--bg-tertiary);border:1px solid var(--border-primary)">← Geri</a>
        <div class="delivery-title">📦 Paket <span>Takip Paneli</span></div>
      </div>
      <div class="delivery-stats">
        <div class="delivery-stat">
          <span>🔥 Aktif</span>
          <span class="delivery-stat-value" id="stat-active">0</span>
        </div>
        <div class="delivery-stat">
          <span>✅ Bugün</span>
          <span class="delivery-stat-value" id="stat-today">0</span>
        </div>
        <div class="delivery-stat">
          <span>💰 Ciro</span>
          <span class="delivery-stat-value" id="stat-revenue">₺0</span>
        </div>
        <button onclick="fetch('/api/auth/logout',{method:'POST'}).then(()=>location.href='/login.html')" style="background:var(--bg-tertiary);border:1px solid var(--border-primary);color:var(--text-muted);padding:8px 14px;border-radius:8px;cursor:pointer;font-size:0.8rem">🚪 Çıkış</button>
      </div>
    </header>

    <div class="delivery-board">
      <!-- Hazırlanıyor -->
      <div class="delivery-column col-preparing">
        <div class="delivery-column-header">
          🔥 Hazırlanıyor <span class="count" id="count-preparing">0</span>
        </div>
        <div class="delivery-column-body" id="col-preparing"></div>
      </div>
      <!-- Hazır -->
      <div class="delivery-column col-ready">
        <div class="delivery-column-header">
          ✅ Hazır <span class="count" id="count-ready">0</span>
        </div>
        <div class="delivery-column-body" id="col-ready"></div>
      </div>
      <!-- Yolda -->
      <div class="delivery-column col-out">
        <div class="delivery-column-header">
          🏃 Yolda / Teslimatta <span class="count" id="count-out">0</span>
        </div>
        <div class="delivery-column-body" id="col-out"></div>
      </div>
      <!-- Teslim Edildi -->
      <div class="delivery-column col-delivered">
        <div class="delivery-column-header">
          📋 Teslim Edildi (Bugün) <span class="count" id="count-delivered">0</span>
        </div>
        <div class="delivery-column-body" id="col-delivered"></div>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/delivery.js"></script>
  <footer class="dev-footer">Yazılım Geliştirici: <a href="https://webyaz.com.tr" target="_blank">webyaz.com.tr</a></footer>
</body>
</html>
